name: Scoped sparse rank checks
on:
  push:
    branches: [ci-sparse-rank-products]
permissions:
  contents: read
jobs:
  exact-rank:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d73d3df7183e0b1a5f3a34cb3e059eefe45a07e
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /research/sparse-rank-witness-products/
            /research/integer-rank-product-checks/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Complete registered conformance
        run: python -B scripts/research_package.py --package research/sparse-rank-witness-products
      - name: Existing rational-rank tests
        run: python -W error -B -m unittest discover -s tests -p test_research_rational_rank.py -v
      - name: Existing optimized rational-rank tests
        run: python -O -W error -B -m unittest discover -s tests -p test_research_rational_rank.py -v
      - name: Retained product-check conformance
        run: python -W error -B research/integer-rank-product-checks/verify.py
      - name: Retained optimized product-check conformance
        run: python -O -W error -B research/integer-rank-product-checks/verify.py
      - name: Committed bytes and POSIX modes
        if: runner.os == 'Linux'
        run: python -B scripts/check_research_commit.py --package research/sparse-rank-witness-products --check-modes
